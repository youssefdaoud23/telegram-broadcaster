name: Tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install httpx2
      - run: python -m compileall -q broadcaster tests
      - run: python -m unittest discover -s tests -v
