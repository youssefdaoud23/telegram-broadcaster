services:
  broadcaster:
    build: .
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    env_file: .env
    # Legacy default keeps existing installations reachable. Fresh installs
    # generated by scripts/configure.py bind to 127.0.0.1 by default.
    ports:
      - "${BROADCASTER_BIND_IP:-0.0.0.0}:${BROADCASTER_PORT:-8789}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
