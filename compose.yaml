services:
  broadcaster:
    build: .
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    env_file: .env
    ports:
      - "127.0.0.1:8789:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    networks:
      default: {}
      cloudflare_origin:
        aliases:
          - telegram-broadcaster-origin

networks:
  cloudflare_origin:
    external: true
    name: cloudflare_default
